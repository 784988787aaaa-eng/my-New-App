name: Smart Ledger Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Generate ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 24 > /tmp/ci-keystore-password
          openssl rand -hex 24 > /tmp/ci-key-password
          echo "CI_KEYSTORE_PASSWORD=$(cat /tmp/ci-keystore-password)" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=$(cat /tmp/ci-key-password)" >> "$GITHUB_ENV"
          CI_KEY_ALIAS="smart-ledger-ci-$(openssl rand -hex 6)"
          echo "CI_KEY_ALIAS=$CI_KEY_ALIAS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore /tmp/smart-ledger-ci.jks \
            -storetype PKCS12 \
            -storepass "$(cat /tmp/ci-keystore-password)" \
            -keypass "$(cat /tmp/ci-key-password)" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Smart Ledger CI, OU=Testing, O=Smart Ledger, C=XX"
          echo "CI_KEYSTORE=/tmp/smart-ledger-ci.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Debug APK
        run: gradle assembleDebug
      - name: Signed release APK (ephemeral test certificate)
        run: gradle assembleRelease
